<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEMM - Jellyfin Easy Metadata Manager - Player</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #10131a;
    }

    .background {
        position: fixed;
        inset: 0;

        /* Substitua pela sua imagem */
        background:
            linear-gradient(
                rgba(16,19,26,0.55),
                rgba(16,19,26,0.75)
            ),
            url("background.jpg");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    .overlay {
        position: absolute;
        inset: 0;

        background:
            radial-gradient(
                circle at top right,
                rgba(170, 84, 255, 0.25),
                transparent 40%
            ),
            radial-gradient(
                circle at bottom left,
                rgba(0, 163, 255, 0.15),
                transparent 40%
            );
    }

    .container {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
    }

    .player-placeholder {
        width: min(1200px, 90vw);
        aspect-ratio: 16 / 9;

        background: rgba(20, 24, 35, 0.72);
        backdrop-filter: blur(12px);

        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 18px;

        display: flex;
        align-items: center;
        justify-content: center;

        box-shadow:
            0 0 40px rgba(170,84,255,0.25),
            0 20px 60px rgba(0,0,0,0.5);
    }

    .message {
        text-align: center;
        color: #fff;
    }

    .message h1 {
        font-size: 2rem;
        margin-bottom: 12px;
        color: #AA54FF;
    }

    .message p {
        color: #b7c0d0;
        font-size: 1rem;
    }
</style>
</head>

<body>

<div class="background">
    <div class="overlay"></div>
</div>

<div class="container">
    <div class="player-placeholder">

        <!-- Exemplo:
        <video controls autoplay>
            <source src="https://www.xpto.com" >
        </video>
        -->

    </div>
</div>

</body>
</html>
